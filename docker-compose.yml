services:
  # Stands in for MongoDB Atlas -- a single-node replica set (enables change streams)
  mongo:
    image: mongo:7
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - "27017:27017"
    healthcheck:
      test: >-
        mongosh --eval "try{rs.status().ok}catch(e){rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok}" --quiet
      interval: 3s
      timeout: 5s
      retries: 10

  # The smongo web dashboard + wire server -- Small MongoDB, big dashboard
  app:
    build: .
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"     # web dashboard
      - "27018:27018"   # wire protocol (connect Compass here)
    environment:
      MONGO_URI: mongodb://mongo:27017
      BIND_HOST: "0.0.0.0"
      WIRE_PORT: "27018"
      WIRE_HOST: "0.0.0.0"
    volumes:
      - wt_data:/app/local_wt_data

volumes:
  wt_data:
