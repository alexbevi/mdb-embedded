[build-system]
requires = ["maturin>=1.0"]
build-backend = "maturin"

[project]
name = "smongo"
version = "1.2.1"
description = "Small MongoDB, big ambitions -- a local-first document engine (redb + Rust) with Atlas sync"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "smongo contributors"}]
keywords = ["mongodb", "embedded", "redb", "database", "local-first", "sync", "smongo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Typing :: Typed",
]
dependencies = [
    "pymongo>=4.6",
]

[project.urls]
Repository = "https://github.com/ranfysvalle02/mdb-embedded"

[project.scripts]
smongo-wire = "smongo.wire.__main__:main"

[project.optional-dependencies]
web = ["flask>=3.0"]
vector = ["numpy>=1.26", "usearch>=2.0"]
all = ["flask>=3.0", "numpy>=1.26", "usearch>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "testcontainers[mongodb]>=4.0",
    "ruff>=0.8,<0.9",
    "mypy~=1.14.1",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "smongo._smongo_core"
manifest-path = "rust/smongo-py/Cargo.toml"
python-source = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (no Docker, no network)",
    "integration: Integration tests requiring Docker MongoDB",
    "performance: Performance benchmarks",
]
addopts = "-m 'not integration and not performance' --tb=short -q"

[tool.coverage.run]
source = ["smongo", "web_app"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 70

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = [
    "crc32c",
    "snappy",
    "zstandard",
    "usearch.*",
    "smongo._smongo_core",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "smongo.wire.msg",
    "smongo.aggregation.vector",
]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "smongo.sync.*",
    "smongo.storage.redb_engine",
    "smongo.wire.commands.admin",
]
disable_error_code = ["attr-defined", "no-any-return", "has-type"]

[[tool.mypy.overrides]]
module = "smongo.client"
disable_error_code = ["arg-type"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # line length handled by formatter
    "E402",    # module-level imports not at top -- unavoidable with try/except import guards
    "E731",    # lambda assignment -- inline lambdas are clearer in some contexts
    "B010",    # do not call setattr with a constant attribute value
    "B905",    # zip-without-strict -- strict= breaks on iterators without __len__
    "SIM102",  # collapsible-if -- nested ifs are often clearer with cursor ops
    "SIM105",  # suppressible-exception -- contextlib.suppress obscures control flow in tight loops
    "SIM108",  # use ternary operator -- often less readable
    "UP015",   # unnecessary open mode parameters
    "RUF012",  # mutable class attributes (false positives on descriptors)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "B017", "SIM300", "F841"]


[tool.ruff.lint.isort]
known-first-party = ["smongo"]
