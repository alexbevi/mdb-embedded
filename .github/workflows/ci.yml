name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RUST_TOOLCHAIN: "1.84.0"
  WASM_PACK_VERSION: "0.14.0"
  PRE_COMMIT_VERSION: "4.1.0"
  CARGO_AUDIT_VERSION: "0.21.1"
  PIP_AUDIT_VERSION: "2.7.3"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: pip install pre-commit==${{ env.PRE_COMMIT_VERSION }}
      - run: pre-commit run --all-files

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install cargo-audit
        run: cargo install cargo-audit --version ${{ env.CARGO_AUDIT_VERSION }} --locked
      - name: Rust dependency audit
        run: cargo audit --file rust/Cargo.lock
      - name: Install pip-audit
        run: pip install pip-audit==${{ env.PIP_AUDIT_VERSION }}
      - name: Python dependency audit
        run: pip-audit -r requirements.txt

  typecheck:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install dependencies
        run: pip install -e ".[dev,all]"
      - name: Run mypy
        run: make typecheck

  test:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install dependencies
        run: pip install -e ".[dev,all]"
      - name: Verify native extension
        run: make ensure-extension
      - name: Run Rust tests
        if: matrix.python-version == '3.11'
        run: cargo test --manifest-path rust/Cargo.toml
      - name: Run tests with coverage
        run: make coverage
      - name: Generate HTML coverage report
        if: always() && hashFiles('.coverage') != ''
        run: python -m coverage html -d htmlcov
      - name: Upload coverage artifacts
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            .coverage
            htmlcov/
      - name: Upload to Codecov
        if: always() && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: .coverage
          token: ${{ secrets.CODECOV_TOKEN }}

  wasm:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --version ${{ env.WASM_PACK_VERSION }} --locked
      - name: Check WASM compilation
        run: cargo check --manifest-path rust/Cargo.toml -p smongo-engine --target wasm32-unknown-unknown
      - name: Build WASM bundle
        run: make build-wasm
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        working-directory: rust/smongo-engine/wasm
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run WASM e2e tests
        working-directory: rust/smongo-engine/wasm
        run: npx playwright test

  integration:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install dependencies
        run: pip install -e ".[dev,all]"
      - name: Run integration tests
        run: pytest tests/integration -m integration -v --override-ini="addopts="
